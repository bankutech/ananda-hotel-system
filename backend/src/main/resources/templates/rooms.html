<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Rooms - LuxeStay</title>
</head>
<body>
    <section>
        <div class="page-header">
            <h1 class="page-title">Accommodations</h1>
            <a th:href="@{/rooms/add}" class="btn btn-primary">
                <i data-feather="plus"></i> Add New Room
            </a>
        </div>

        <div class="room-grid">
            <div th:each="room : ${rooms}" class="room-card">
                <h3 th:text="${room.number}"></h3>
                <div class="room-type" th:text="${room.type}"></div>
                
                <div style="margin-bottom: 24px;">
                    <span th:class="'badge ' + ${room.status == 'available' ? 'available' : (room.status == 'occupied' ? 'occupied' : 'warning')}" th:text="${room.status}"></span>
                </div>
                
                <div class="room-card-footer">
                    <div class="room-price">
                        $<span th:text="${room.price}"></span>
                        <span>/ night</span>
                    </div>
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <a th:href="@{/rooms/edit/{id}(id=${room.id})}" class="btn btn-secondary" style="padding: 8px; border-radius: 4px;">
                            <i data-feather="edit-2" style="width: 14px; height: 14px;"></i>
                        </a>
                        <form th:action="@{/rooms/delete/{id}(id=${room.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-secondary" style="padding: 8px; border-radius: 4px; color: var(--danger-color); border-color: var(--danger-color);" onclick="return confirm('Are you sure you want to delete this room?');">
                                <i data-feather="trash-2" style="width: 14px; height: 14px;"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(rooms)}" style="grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-secondary); background: var(--surface-color); border: 1px dashed var(--border-strong);">
                No rooms currently available in the registry.
            </div>
        </div>
    </section>
</body>
</html>
