<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Grab & Go Kiosk (POS) - LuxeStay</title>
</head>
<body>
    <section>
        <div class="page-header">
            <h1 class="page-title">Lobby Kiosk POS</h1>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
            <!-- POS Terminal -->
            <div class="card" style="border: 2px solid var(--accent-color);">
                <h3 style="font-family: var(--font-heading); font-size: 24px; color: var(--primary-color); margin-bottom: 24px;">Post Room Charge</h3>
                
                <form th:action="@{/kiosk/charge}" method="post" style="display: flex; flex-direction: column; gap: 24px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Select Active Guest Room</label>
                        <select name="bookingId" required>
                            <option value="">-- Select Room --</option>
                            <option th:each="b : ${activeBookings}" th:value="${b.id}" th:text="'Room ' + ${b.room.number} + ' (' + ${b.guest.name} + ')'"></option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Item Description</label>
                        <input type="text" name="itemName" placeholder="e.g., Evian Water Bottle" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Amount ($)</label>
                        <input type="number" step="0.01" name="amount" placeholder="0.00" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="padding: 16px; font-size: 16px;"><i data-feather="credit-card"></i> Post to Folio</button>
                </form>
            </div>

            <!-- Recent Transactions -->
            <div>
                <h3 style="font-family: var(--font-heading); font-size: 24px; color: var(--primary-color); margin-bottom: 24px;">Recent Transactions</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Room</th>
                                <th>Item</th>
                                <th>Amount</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="charge : ${recentCharges}">
                                <td style="font-weight: 600;" th:text="${charge.booking.room.number}"></td>
                                <td th:text="${charge.itemName}"></td>
                                <td style="color: var(--primary-color); font-weight: 700;" th:text="'$' + ${#numbers.formatDecimal(charge.amount, 1, 2)}"></td>
                                <td th:text="${#temporals.format(charge.chargeTime, 'HH:mm')}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentCharges)}">
                                <td colspan="4" style="text-align: center; padding: 20px; color: var(--text-secondary);">No charges today.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
