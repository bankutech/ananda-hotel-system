<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Bookings - LuxeStay</title>
</head>
<body>
    <section>
        <div class="page-header">
            <h1 class="page-title">Reservations Ledger</h1>
            <a th:href="@{/bookings/add}" class="btn btn-primary">
                <i data-feather="plus"></i> New Reservation
            </a>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Guest</th>
                        <th>Accommodation</th>
                        <th>Dates</th>
                        <th>Total Cost</th>
                        <th>Status</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td style="font-family: var(--font-heading); font-size: 20px; font-weight: 600; color: var(--primary-color);" th:text="${booking.guest.name}"></td>
                        <td th:text="'Room ' + ${booking.room.number} + ' - ' + ${booking.room.type}"></td>
                        <td th:text="${booking.checkIn} + ' to ' + ${booking.checkOut}"></td>
                        <td style="font-family: var(--font-heading); font-size: 20px; font-weight: 600;" th:text="'$' + ${booking.totalCost}"></td>
                        <td>
                            <span th:class="'badge ' + ${booking.status == 'completed' ? 'available' : (booking.status == 'active' ? 'occupied' : 'warning')}" th:text="${booking.status}"></span>
                        </td>
                        <td style="text-align: right; display: flex; justify-content: flex-end; gap: 8px;">
                            <form th:if="${booking.status == 'active'}" th:action="@{/bookings/checkout/{id}(id=${booking.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-primary" style="padding: 6px 12px; background: var(--warning-color); border: none; color: #fff;">
                                    <i data-feather="check-circle" style="width: 14px; height: 14px;"></i> Check-Out
                                </button>
                            </form>
                            <form th:if="${booking.status == 'completed'}" th:action="@{/invoices/generate/{id}(id=${booking.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-primary" style="padding: 6px 12px; background: var(--success-color); border: none; color: #fff;">
                                    <i data-feather="file-text" style="width: 14px; height: 14px;"></i> Bill
                                </button>
                            </form>
                            <form th:action="@{/bookings/delete/{id}(id=${booking.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-secondary" style="padding: 6px 12px; border: none; color: var(--danger-color);" onclick="return confirm('Are you sure you want to delete this reservation?');">
                                    <i data-feather="trash-2" style="width: 14px; height: 14px;"></i> Cancel
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            No reservations found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>
</html>
