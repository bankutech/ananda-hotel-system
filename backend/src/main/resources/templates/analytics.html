<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Analytics & Reports - LuxeStay</title>
</head>
<body>
    <section>
        <div class="page-header">
            <h1 class="page-title">Executive Analytics</h1>
        </div>

        <div class="dashboard-stats">
            <div class="stat-card">
                <div class="stat-title"><i data-feather="percent"></i> Current Occupancy</div>
                <div class="stat-value" th:text="${occupancyRate} + '%'"></div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i data-feather="trending-up"></i> Average Daily Rate (ADR)</div>
                <div class="stat-value" th:text="'$' + ${adr}"></div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i data-feather="dollar-sign"></i> RevPAR</div>
                <div class="stat-value" th:text="'$' + ${revpar}"></div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i data-feather="grid"></i> Total Sellable Rooms</div>
                <div class="stat-value" th:text="${totalRooms}"></div>
            </div>
        </div>

        <div class="card" style="margin-top: 40px;">
            <h3 style="font-family: var(--font-heading); font-size: 24px; color: var(--primary-color); margin-bottom: 24px;">YTD Performance</h3>
            <div style="height: 300px; display: flex; align-items: flex-end; gap: 16px; padding-top: 24px; border-bottom: 2px solid var(--border-strong);">
                <!-- Simulated Bar Chart -->
                <div style="flex: 1; background: var(--primary-color); height: 40%; border-radius: 4px 4px 0 0; opacity: 0.7;"></div>
                <div style="flex: 1; background: var(--primary-color); height: 60%; border-radius: 4px 4px 0 0; opacity: 0.8;"></div>
                <div style="flex: 1; background: var(--primary-color); height: 85%; border-radius: 4px 4px 0 0; opacity: 0.9;"></div>
                <div style="flex: 1; background: var(--accent-color); height: 100%; border-radius: 4px 4px 0 0; box-shadow: 0 0 15px rgba(212,175,55,0.4);"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 16px; color: var(--text-secondary); font-size: 13px; font-weight: 700; text-transform: uppercase;">
                <span>Q1</span>
                <span>Q2</span>
                <span>Q3</span>
                <span style="color: var(--accent-color);">Q4 (Current)</span>
            </div>
        </div>
    </section>
</body>
</html>
