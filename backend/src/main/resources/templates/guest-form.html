<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Guest Form - LuxeStay</title>
</head>
<body>
    <section>
        <div class="page-header">
            <h1 class="page-title" th:text="${guest.id == null ? 'Register Guest' : 'Edit Guest Profile'}"></h1>
            <a th:href="@{/guests}" class="btn btn-secondary">
                <i data-feather="arrow-left"></i> Back to Registry
            </a>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <form th:action="${guest.id == null ? '/guests/add' : '/guests/edit/' + guest.id}" th:object="${guest}" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" required placeholder="e.g. John Doe">
                </div>
                
                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="text" id="phone" th:field="*{phone}" required placeholder="e.g. (555) 123-4567">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" required placeholder="e.g. john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="idDocument">ID / Passport Number</label>
                    <input type="text" id="idDocument" th:field="*{idDocument}" required placeholder="Passport or Driver's License">
                </div>
                
                <div style="margin-top: 32px; display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn btn-primary" style="padding: 14px 32px;">
                        <i data-feather="save"></i> Save Guest Profile
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
